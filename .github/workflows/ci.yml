name: Build, pack and publish

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # This must run before NuGet restore because the solution targets MAUI.
      - name: Restore .NET workloads
        run: dotnet workload restore Blastic.sln --skip-manifest-update

      - name: Restore NuGet packages
        run: dotnet restore Blastic.sln

      - name: Build libraries and tests
        shell: pwsh
        run: |
          $projects = @(
            "Blastic.Wpf.Sample/Blastic.Wpf.Sample.csproj"
            "Blastic.CodeGeneration.Test/Blastic.CodeGeneration.Test.csproj"
            "Blastic.Avalonia/Blastic.Avalonia.csproj"
            "Blastic.Skia.Avalonia/Blastic.Skia.Avalonia.csproj"
            "Blastic.Maui/Blastic.Maui.csproj"
            "Blastic.Skia.Maui/Blastic.Skia.Maui.csproj"
          )

          foreach ($project in $projects) {
            dotnet build $project --configuration $env:CONFIGURATION --no-restore

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Build MAUI sample
        shell: pwsh
        run: |
          dotnet build Blastic.Maui.Sample/Blastic.Maui.Sample.csproj `
            --framework net10.0-ios `
            --configuration $env:CONFIGURATION `
            --no-restore

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          # The Windows target resolves win-x64 during its framework-specific restore.
          dotnet build Blastic.Maui.Sample/Blastic.Maui.Sample.csproj `
            --framework net10.0-windows10.0.19041.0 `
            --configuration $env:CONFIGURATION

      - name: Pack NuGet packages
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyyMMdd"
          $version = "1.0.0-beta-$date.${{ github.run_number }}"
          $projects = @(
            "Blastic/Blastic.csproj"
            "Blastic.CodeGeneration/Blastic.CodeGeneration.csproj"
            "Blastic.Data/Blastic.Data.csproj"
            "Blastic.Wpf/Blastic.Wpf.csproj"
            "Blastic.Wpf.Material/Blastic.Wpf.Material.csproj"
          )

          foreach ($project in $projects) {
            dotnet pack $project `
              --configuration $env:CONFIGURATION `
              --no-restore `
              --output artifacts `
              -p:Authors="Yusuf Tarık Günaydın" `
              -p:Version=$version

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts

      - name: Log in to NuGet with trusted publishing
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ytg

      - name: Publish NuGet packages
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
